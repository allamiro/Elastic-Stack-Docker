services:
  # Kafka Controllers (KRaft mode - no Zookeeper needed)
  kafka-controller-1:
    profiles: ["kafka-cluster"]
    image: apache/kafka:${KAFKA_VERSION}
    container_name: kafka-controller-1
    volumes:
      - certs:/opt/kafka/config/certs
      - ./config/kafka:/opt/kafka/config/custom
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://kafka-controller-1:${KAFKA_CONTROLLER_1_PORT}
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SSL,SSL:SSL,PLAINTEXT_HOST:SSL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller-1:${KAFKA_CONTROLLER_1_PORT},2@kafka-controller-2:${KAFKA_CONTROLLER_2_PORT},3@kafka-controller-3:${KAFKA_CONTROLLER_3_PORT}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      # SSL Configuration
      KAFKA_SSL_KEYSTORE_LOCATION: /opt/kafka/config/certs/kafka-controller-1/kafka-controller-1.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_SSL_KEYSTORE_PASSWORD}
      KAFKA_SSL_KEY_PASSWORD: ${KAFKA_SSL_KEY_PASSWORD}
      KAFKA_SSL_TRUSTSTORE_LOCATION: /opt/kafka/config/certs/ca/ca.p12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_SSL_TRUSTSTORE_PASSWORD}
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
    depends_on:
      setup:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server kafka-controller-1:${KAFKA_CONTROLLER_1_PORT} --command-config /opt/kafka/config/custom/ssl-client.properties"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-controller-2:
    profiles: ["kafka-cluster"]
    image: apache/kafka:${KAFKA_VERSION}
    container_name: kafka-controller-2
