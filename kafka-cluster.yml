    environment:
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: SSL://kafka-broker-3:19092,PLAINTEXT_HOST://kafka-broker-3:9092
      KAFKA_ADVERTISED_LISTENERS: SSL://kafka-broker-3:19092,PLAINTEXT_HOST://localhost:${KAFKA_BROKER_3_PORT}
      KAFKA_INTER_BROKER_LISTENER_NAME: SSL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SSL,SSL:SSL,PLAINTEXT_HOST:SSL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-controller-1:${KAFKA_CONTROLLER_1_PORT},2@kafka-controller-2:${KAFKA_CONTROLLER_2_PORT},3@kafka-controller-3:${KAFKA_CONTROLLER_3_PORT}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
