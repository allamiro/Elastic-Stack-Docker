services:
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
    user: "0"
    command: >
      bash -c '
        if [ x${ELASTIC_PASSWORD} == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
          exit 1;
        elif [ x${KIBANA_PASSWORD} == x ]; then
          echo "Set the KIBANA_PASSWORD environment variable in the .env file";
          exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
          cat config/certs/ca/ca.crt config/certs/ca/ca.key > config/certs/ca/ca.pem
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          echo -ne \
          "instances:\n"\
          "  - name: es01\n"\
          "    dns:\n"\
          "      - es01\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "      - ${DOCKER_HOST_IP}\n"\
          "  - name: es02\n"\
          "    dns:\n"\
          "      - es02\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "  - name: es03\n"\
          "    dns:\n"\
          "      - es03\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "  - name: ml01\n"\
          "    dns:\n"\
          "      - ml01\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "      - ${DOCKER_HOST_IP}\n"\
          "  - name: fz01\n"\
          "    dns:\n"\
          "      - fz01\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "      - ${DOCKER_HOST_IP}\n"\
          "  - name: kibana\n"\
          "    dns:\n"\
          "      - kibana\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "      - ${DOCKER_HOST_IP}\n"\
          "  - name: fleet-server\n"\
          "    dns:\n"\
          "      - fleet-server\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "      - ${DOCKER_HOST_IP}\n"\
          "  - name: ems-server\n"\
          "    dns:\n"\
          "      - ems-server\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "      - ${DOCKER_HOST_IP}\n"\
          "  - name: kafka-controller-1\n"\
          "    dns:\n"\
          "      - kafka-controller-1\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "      - ${DOCKER_HOST_IP}\n"\
          "  - name: kafka-controller-2\n"\
          "    dns:\n"\
          "      - kafka-controller-2\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "      - ${DOCKER_HOST_IP}\n"\
          "  - name: kafka-controller-3\n"\
          "    dns:\n"\
          "      - kafka-controller-3\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "      - ${DOCKER_HOST_IP}\n"\
          "  - name: kafka-broker-1\n"\
          "    dns:\n"\
          "      - kafka-broker-1\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "      - ${DOCKER_HOST_IP}\n"\
          "  - name: kafka-broker-2\n"\
          "    dns:\n"\
          "      - kafka-broker-2\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "      - ${DOCKER_HOST_IP}\n"\
          "  - name: kafka-broker-3\n"\
          "    dns:\n"\
          "      - kafka-broker-3\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "      - ${DOCKER_HOST_IP}\n"\
          > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        echo "Creating Kafka keystores and truststores"
        # Create CA truststore for Kafka
        openssl pkcs12 -export -out config/certs/ca/ca.p12 -nokeys -in config/certs/ca/ca.crt -passout pass:${KAFKA_SSL_TRUSTSTORE_PASSWORD};
        
        # Create keystores for Kafka controllers
        for i in 1 2 3; do
          if [ -f config/certs/kafka-controller-$i/kafka-controller-$i.crt ]; then
            openssl pkcs12 -export -out config/certs/kafka-controller-$i/kafka-controller-$i.p12 \
              -inkey config/certs/kafka-controller-$i/kafka-controller-$i.key \
              -in config/certs/kafka-controller-$i/kafka-controller-$i.crt \
              -certfile config/certs/ca/ca.crt \
              -passout pass:${KAFKA_SSL_KEYSTORE_PASSWORD};
          fi
        done
        
        # Create keystores for Kafka brokers
        for i in 1 2 3; do
          if [ -f config/certs/kafka-broker-$i/kafka-broker-$i.crt ]; then
            openssl pkcs12 -export -out config/certs/kafka-broker-$i/kafka-broker-$i.p12 \
              -inkey config/certs/kafka-broker-$i/kafka-broker-$i.key \
              -in config/certs/kafka-broker-$i/kafka-broker-$i.crt \
              -certfile config/certs/ca/ca.crt \
              -passout pass:${KAFKA_SSL_KEYSTORE_PASSWORD};
          fi
        done
        
        echo "Setting file permissions"
        chown -R root:root config/certs;
        find . -type d -exec chmod 755 \{\} \;;
        find . -type f -exec chmod 644 \{\} \;;
        echo "Waiting for Elasticsearch availability";
        until curl -s --cacert config/certs/ca/ca.crt https://es01:9200 | grep -q "missing authentication credentials"; do sleep 30; done;
        echo "Setting kibana_system password";
        until curl -s -X POST --cacert config/certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" https://es01:9200/_security/user/kibana_system/_password -d "{\"password\":\"${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 10; done;
        echo "All done!";
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/es01/es01.crt ]"]
      interval: 1s
      timeout: 5s
      retries: 120