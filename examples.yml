
volumes:
  mldata01:
    driver: local
  fzdata01:
    driver: local
  minio-data:
    driver: local
  metricbeatdata01:
    driver: local
  filebeatdata01:
    driver: local
  logstashdata01:
    driver: local
  kafkadata:
    driver: local
  logstash-kafka-in-data:
    driver: local
  logstash-kafka-out-data:
    driver: local

services:
  # The ml01 is configured to be a dedicated ML node within the cluster large enough to download and install the ELSER model
  ml01:
    extends:
      file: elastic-stack.yml
      service: elasticsearch
    profiles:
      - ml
    depends_on:
      es01:
        condition: service_healthy
    volumes:
      - mldata01:/usr/share/elasticsearch/data
    environment:
      - node.name=ml01
      - node.roles=ml, remote_cluster_client
      - discovery.seed_hosts=es01
      - xpack.security.http.ssl.key=certs/ml01/ml01.key
      - xpack.security.http.ssl.certificate=certs/ml01/ml01.crt
      - xpack.security.transport.ssl.key=certs/ml01/ml01.key
      - xpack.security.transport.ssl.certificate=certs/ml01/ml01.crt
    deploy:
      resources:
        limits:
          cpus: ${ML_CPU_LIMIT}
          memory: ${ML_MEM_LIMIT}
        reservations:
          cpus: ${ML_CPU_LIMIT}
          memory: ${ML_MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1

  # The fz01 is configured to be a dedicated Frozen node within the cluster
  fz01:
    extends:
      file: elastic-stack.yml
      service: elasticsearch
    profiles:
      - frozen
    depends_on:
      es01:
        condition: service_healthy
      kibana:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - fzdata01:/usr/share/elasticsearch/data
      - ./config/es-frozen_node-startup.sh:/usr/local/bin/es-frozen_node-startup.sh:ro
    entrypoint: ["es-frozen_node-startup.sh"]
    environment:
      - node.name=fz01
      - node.roles=data_frozen
      - discovery.seed_hosts=es01
      - xpack.security.http.ssl.key=certs/fz01/fz01.key
      - xpack.security.http.ssl.certificate=certs/fz01/fz01.crt
      - xpack.security.transport.ssl.key=certs/fz01/fz01.key
      - xpack.security.transport.ssl.certificate=certs/fz01/fz01.crt
      - xpack.searchable.snapshot.shared_cache.size=${SNAPSHOT_SHARED_CACHE_SIZE}
    deploy:
      resources:
        limits:
          cpus: ${FROZEN_CPU_LIMIT}
          memory: ${FROZEN_MEM_LIMIT}
        reservations:
          cpus: ${FROZEN_CPU_LIMIT}
          memory: ${FROZEN_MEM_LIMIT}

  # The minio service is used to store the frozen snapshots. It is configured to be a standalone service
  minio:
    image: minio/minio:latest
    container_name: minio
    profiles:
      - frozen
    ports:
      - ${MINIO_API_PORT}:9000
      - ${MINIO_GUI_PORT}:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  # The minio-setup service is used to configure the minio service.
  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    profiles:
      - frozen
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOSTS: minio=http://minio:9000
      MC_ALIAS: minio
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    entrypoint: >
      sh -c "
        sleep 5;
        mc alias set es-s3 http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        mc mb es-s3/${MINIO_BUCKET_NAME};
        echo '
        {
          \"Version\": \"2012-10-17\",
          \"Statement\": [
            {
              \"Effect\": \"Allow\",
              \"Action\": [
                  \"s3:ListBucket\"
              ],
              \"Resource\": [
                  \"arn:aws:s3:::'${MINIO_BUCKET_NAME}'\"
              ]
            },
            {
              \"Effect\": \"Allow\",
              \"Action\": [
                  \"s3:*Object\"
              ],
              \"Resource\": [
                  \"arn:aws:s3:::'${MINIO_BUCKET_NAME}'/*\"
              ]
            }
          ]
        }' > /tmp/elastic-bucket-policy.json;
        mc admin policy create es-s3 elastic-s3 /tmp/elastic-bucket-policy.json;
        mc admin user add es-s3 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
        mc admin policy attach es-s3 readwrite --user ${MINIO_ACCESS_KEY};
        mc admin policy attach es-s3 elastic-s3 --user ${MINIO_ACCESS_KEY};
        mc ls es-s3;
        echo 'MinIO operations completed.';
        # while true; do sleep 30; done;
      "

  # Metricbeat is used for stack monitoring (Optional)
  metricbeat01:
    profiles:
      - monitoring
    depends_on:
      es01:
        condition: service_healthy
      kibana:
        condition: service_healthy
    image: docker.elastic.co/beats/metricbeat:${STACK_VERSION}
    restart: unless-stopped
    user: root
    volumes:
      - certs:/usr/share/metricbeat/certs
      - metricbeatdata01:/usr/share/metricbeat/data
      - "./config/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro"
      - "/proc:/hostfs/proc:ro"
      - "/:/hostfs:ro"
    environment:
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTIC_HOSTS=https://es01:9200,https://es02:9200,https://es03:9200
      - KIBANA_HOSTS=https://kibana:5601
      - LOGSTASH_HOSTS=http://logstash01:9600
      - CA_CERT=certs/ca/ca.crt
      - ES_CERT=certs/es01/es01.crt
      - ES_KEY=certs/es01/es01.key
      - KB_CERT=certs/kibana/kibana.crt
      - KB_KEY=certs/kibana/kibana.key
    command:
      --strict.perms=false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert /usr/share/metricbeat/certs/ca/ca.crt https://es01:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  # Filebeat is configured to ingest data from the filebeat_ingest_data folder, drop .log files in this folder to ingest
  # Filebeat is also configured to pull logs for all docker containers (visible in the Logs Stream viewer) (Optional)
  filebeat01:
    profiles:
      - filebeat
    depends_on:
      es01:
        condition: service_healthy
      kibana:
        condition: service_healthy
    image: docker.elastic.co/beats/filebeat:${STACK_VERSION}
    restart: unless-stopped
    user: root
    volumes:
      - certs:/usr/share/filebeat/certs
      - filebeatdata01:/usr/share/filebeat/data
      - "./filebeat_ingest_data/:/usr/share/filebeat/ingest_data/"
      - "./config/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro"
      - "/var/lib/docker/containers:/var/lib/docker/containers:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTIC_HOSTS=https://es01:9200
      - KIBANA_HOSTS=https://kibana:5601
      - LOGSTASH_HOSTS=http://logstash01:9600
      - CA_CERT=certs/ca/ca.crt
    command:
      --strict.perms=false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert /usr/share/filebeat/certs/ca/ca.crt https://es01:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  # Logstash is configured to ingest data from the logstash_ingest_data folder (Optional)
  logstash01:
    profiles:
      - logstash
    depends_on:
      es01:
        condition: service_healthy
      kibana:
        condition: service_healthy
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION}
    restart: unless-stopped
    labels:
      co.elastic.logs/module: logstash
    volumes:
      - certs:/usr/share/logstash/certs
      - logstashdata01:/usr/share/logstash/data
      - "./logstash_ingest_data/:/usr/share/logstash/ingest_data/"
      - "./config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro"
    environment:
      - xpack.monitoring.enabled=false
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTIC_HOSTS=https://es01:9200
    deploy:
      resources:
        limits:
          cpus: ${LOGSTASH_CPU_LIMIT}
          memory: ${LOGSTASH_MEM_LIMIT}
        reservations:
          cpus: ${LOGSTASH_CPU_LIMIT}
          memory: ${LOGSTASH_MEM_LIMIT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert /usr/share/logstash/certs/ca/ca.crt https://es01:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  # The webapp is an example insturmentation of the elastic APM agent. (Optional)
  # Access the webapp through http://localhost:8000
  webapp:
    profiles:
      - apm
    image: webapp:${STACK_VERSION}
    build:
      context: app
    restart: unless-stopped
    volumes:
      - "/var/lib/docker/containers:/var/lib/docker/containers:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro"
      - "/proc:/hostfs/proc:ro"
      - "/:/hostfs:ro"
    ports:
      - ${APM_APP_PORT}:8000
    healthcheck:
      test:
        [ 
          "CMD-SHELL", 
          "curl -s http://localhost:8000",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  # The container-agent is an example of insturmenting an agent within a docker container
  container-agent:
    extends:
      file: elastic-stack.yml
      service: elastic-agent
    profiles:
      - agent
    depends_on:
      fleet-server:
        condition: service_healthy
    hostname: container-agent
    volumes:
      - "./agent_ingest_data:/tmp/ingest_data"
      # The following line is not required, nor is the `entrypoint` line. They are running a script to add 
      # integrations to the Fleet policy this agent connects to for demo functionality
      - ./config/agent_add_integrations-startup.sh:/usr/share/elastic-agent/agent-startup.sh
    entrypoint: ["agent-startup.sh"]
    ports:
      - ${AGENT_SYSLOG_UDP_PORT}:9003
      - ${AGENT_SYSLOG_TCP_PORT}:9004
    environment:
      - FLEET_TOKEN_POLICY_NAME=Docker-Container-Policy
      - INTEGRATION_FILESTREAM_VERSION=${INTEGRATION_FILESTREAM_VERSION}
      - INTEGRATION_TCP_LOGS_VERSION=${INTEGRATION_TCP_LOGS_VERSION}
      - INTEGRATION_UDP_LOGS_VERSION=${INTEGRATION_UDP_LOGS_VERSION}

  # Tthe Elastic MCP Server allows LLM Clients to communicate with the Elastic cluster using streamable-HTTP protocol
  mcp-server:
    image: docker.elastic.co/mcp/elasticsearch:latest
    profiles:
      - mcp
    depends_on:
      es01:
        condition: service_healthy
    hostname: es-mcp-server
    command: http
    ports:
      - ${MCP_HTTP_PORT}:8080
    environment:
      - ES_URL=https://es01:9200
      - ES_USERNAME=elastic
      - ES_PASSWORD=${ELASTIC_PASSWORD}
      - ES_SSL_SKIP_VERIFY=true

  # ============================================================================
  # KAFKA PROFILE SERVICES
  # Architecture: [ Producers/logstash-kafka-in ] --> [ Kafka ] --> [ logstash-kafka-out ] --> [ Elasticsearch ]
  # Usage: docker compose --profile kafka up -d
  # ============================================================================

  # Kafka broker using KRaft mode (no Zookeeper required)
  # The broker and external listeners are secured with TLS using the stack-generated CA
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    profiles:
      - kafka
    hostname: kafka
    depends_on:
      setup:
        condition: service_healthy
    ports:
      - ${KAFKA_PORT:-9092}:9092
      - ${KAFKA_EXTERNAL_PORT:-9094}:9094
    environment:
      # KRaft settings (no Zookeeper)
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # Listener configuration - client-facing listeners use TLS with the stack CA
      - KAFKA_LISTENERS=SSL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=SSL://kafka:9092,EXTERNAL://${DOCKER_HOST_IP}:${KAFKA_EXTERNAL_PORT:-9094}
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,SSL:SSL,EXTERNAL:SSL
      - KAFKA_INTER_BROKER_LISTENER_NAME=SSL
      # TLS configuration - the keystore and credential files are generated by the
      # setup service from the stack CA; filenames are relative to /etc/kafka/secrets
      - KAFKA_SSL_KEYSTORE_FILENAME=kafka/kafka.keystore.p12
      - KAFKA_SSL_KEYSTORE_CREDENTIALS=kafka/kafka_creds
      - KAFKA_SSL_KEY_CREDENTIALS=kafka/kafka_creds
      - KAFKA_SSL_KEYSTORE_TYPE=PKCS12
      # The broker also acts as an SSL client for inter-broker traffic, so it must trust the stack CA
      - KAFKA_SSL_TRUSTSTORE_LOCATION=/etc/kafka/secrets/ca/ca.crt
      - KAFKA_SSL_TRUSTSTORE_TYPE=PEM
      - KAFKA_SSL_CLIENT_AUTH=none
      # Topic settings - single broker, so all internal topics must use replication factor 1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_NUM_PARTITIONS=${KAFKA_NUM_PARTITIONS:-3}
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      # Performance settings
      - KAFKA_LOG_RETENTION_HOURS=${KAFKA_LOG_RETENTION_HOURS:-168}
      - KAFKA_LOG_SEGMENT_BYTES=1073741824
      - KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS=300000
      # Cluster ID for KRaft
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      # Store data on the mounted volume (the image default is inside the container filesystem)
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    volumes:
      - certs:/etc/kafka/secrets:ro
      - certs:/certs:ro
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 --command-config /certs/kafka/client-ssl.properties || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  # Kafka setup service - creates topics on startup
  kafka-setup:
    image: apache/kafka:3.9.0
    container_name: kafka-setup
    profiles:
      - kafka
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - certs:/certs:ro
    environment:
      - KAFKA_TOPIC=${KAFKA_TOPIC:-elastic-logs}
      - KAFKA_NUM_PARTITIONS=${KAFKA_NUM_PARTITIONS:-3}
    entrypoint: >
      bash -c "
        echo 'Waiting for Kafka to be ready...';
        sleep 5;
        echo 'Creating Kafka topic: ${KAFKA_TOPIC:-elastic-logs}';
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /certs/kafka/client-ssl.properties --create --if-not-exists --topic ${KAFKA_TOPIC:-elastic-logs} --partitions ${KAFKA_NUM_PARTITIONS:-3} --replication-factor 1;
        echo 'Listing all topics:';
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /certs/kafka/client-ssl.properties --list;
        echo 'Topic details:';
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /certs/kafka/client-ssl.properties --describe --topic ${KAFKA_TOPIC:-elastic-logs};
        echo 'Kafka setup completed successfully!';
      "

  # Logstash Kafka Producer - reads from files/generator and produces to Kafka
  logstash-kafka-in:
    profiles:
      - kafka
    depends_on:
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION}
    container_name: logstash-kafka-in
    restart: unless-stopped
    labels:
      co.elastic.logs/module: logstash
    volumes:
      - certs:/usr/share/logstash/certs
      - logstash-kafka-in-data:/usr/share/logstash/data
      - "./kafka_ingest_data/:/usr/share/logstash/ingest_data/"
      - "./config/logstash-kafka-in.conf:/usr/share/logstash/pipeline/logstash.conf:ro"
    environment:
      - xpack.monitoring.enabled=false
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-elastic-logs}
    deploy:
      resources:
        limits:
          cpus: ${LOGSTASH_CPU_LIMIT}
          memory: ${LOGSTASH_MEM_LIMIT}
        reservations:
          cpus: ${LOGSTASH_CPU_LIMIT}
          memory: ${LOGSTASH_MEM_LIMIT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9600/_node/stats | grep -q '\"status\":\"green\"' || curl -s http://localhost:9600/_node/stats | grep -q '\"status\":\"yellow\"'",
        ]
      interval: 30s
      timeout: 10s
      retries: 120

  # Logstash Kafka Consumer - consumes from Kafka and sends to Elasticsearch
  logstash-kafka-out:
    profiles:
      - kafka
    depends_on:
      es01:
        condition: service_healthy
      kibana:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION}
    container_name: logstash-kafka-out
    restart: unless-stopped
    labels:
      co.elastic.logs/module: logstash
    volumes:
      - certs:/usr/share/logstash/certs
      - logstash-kafka-out-data:/usr/share/logstash/data
      - "./config/logstash-kafka-out.conf:/usr/share/logstash/pipeline/logstash.conf:ro"
    environment:
      - xpack.monitoring.enabled=false
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTIC_HOSTS=https://es01:9200
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=${KAFKA_TOPIC:-elastic-logs}
    deploy:
      resources:
        limits:
          cpus: ${LOGSTASH_CPU_LIMIT}
          memory: ${LOGSTASH_MEM_LIMIT}
        reservations:
          cpus: ${LOGSTASH_CPU_LIMIT}
          memory: ${LOGSTASH_MEM_LIMIT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9600/_node/stats | grep -q '\"status\":\"green\"' || curl -s http://localhost:9600/_node/stats | grep -q '\"status\":\"yellow\"'",
        ]
      interval: 30s
      timeout: 10s
      retries: 120

  # Kafka UI for monitoring and management (Optional but helpful for demos)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    profiles:
      - kafka
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - ${KAFKA_UI_PORT:-8082}:8080
    volumes:
      - certs:/certs:ro
    environment:
      - KAFKA_CLUSTERS_0_NAME=elastic-kafka
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL=SSL
      - KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION=/certs/ca/ca.crt
      - KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE=PEM
      - DYNAMIC_CONFIG_ENABLED=true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 120