# Logstash Kafka Producer Configuration
# This pipeline reads from files and produces messages to Kafka topics

input {
  file {
    # https://www.elastic.co/guide/en/logstash/current/plugins-inputs-file.html
    # default is TAIL which assumes more data will come into the file.
    # change to mode => "read" if the file is a complete file.
    mode => "tail"
    path => "/usr/share/logstash/ingest_data/*"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_kafka"
    tags => ["kafka-demo"]
  }

  # Generator input for demo/testing purposes
  # Generates sample log messages every 10 seconds
  generator {
    lines => [
      '{"level": "INFO", "service": "demo-app", "message": "Application started successfully"}',
      '{"level": "DEBUG", "service": "demo-app", "message": "Processing request"}',
      '{"level": "WARN", "service": "demo-app", "message": "High memory usage detected"}',
      '{"level": "ERROR", "service": "demo-app", "message": "Connection timeout to database"}'
    ]
    # Set count to 0 for infinite generation, or a specific number for limited messages
    # For demo purposes, generates 25 batches (100 messages) then stops
    count => 25
    tags => ["generated", "kafka-demo"]
  }
}

filter {
  # Add timestamp and metadata
  mutate {
    add_field => {
      "ingested_by" => "logstash-kafka-in"
      "pipeline" => "kafka-producer"
    }
  }

  # Try to parse JSON content if present
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }
  }

  # Add unique event ID
  uuid {
    target => "event_id"
  }
}

output {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS}"
    topic_id => "${KAFKA_TOPIC}"
    codec => json
    # TLS settings - trust the stack-generated CA
    security_protocol => "SSL"
    ssl_truststore_location => "/usr/share/logstash/certs/ca/ca.crt"
    ssl_truststore_type => "PEM"
    # Kafka producer settings
    acks => "all"
    retries => 3
    retry_backoff_ms => 100
  }

  # Optional: stdout for debugging (comment out in production)
  # stdout { codec => rubydebug }
}
