input {
  file {
    #https://www.elastic.co/guide/en/logstash/current/plugins-inputs-file.html
    #default is TAIL which assumes more data will come into the file.
    #change to mode => "read" if the file is a compelte file.  by default, the file will be removed once reading is complete -- backup your files if you need them.
    mode => "tail"
    path => "/usr/share/logstash/ingest_data/*"
    start_position => "beginning"
    sincedb_path => "/dev/null"    
  }
}

filter {
  # Insert filters if needed for csv i had to insert this modify if needed
    csv {
    separator => ","
    columns => [
      "Unique ID",
      "Indicator ID",
      "Name",
      "Measure",
      "Measure Info",
      "Geo Type Name",
      "Geo Join ID",
      "Geo Place Name",
      "Time Period",
      "Start_Date",
      "Data Value",
      "Message"
    ]
}

  # Optional: Convert data types
  mutate {
    convert => {
      "Unique ID" => "integer"
      "Indicator ID" => "integer"
      "Measure" => "float"
      "Data Value" => "float"
    }
  }

  # Optional: Rename fields for easier access
  mutate {
    rename => {
      "Unique ID" => "unique_id"
      "Indicator ID" => "indicator_id"
      "Geo Type Name" => "geo_type_name"
      "Geo Join ID" => "geo_join_id"
      "Geo Place Name" => "geo_place_name"
      "Time Period" => "time_period"
      "Start_Date" => "start_date"
      "Data Value" => "data_value"
      "Measure Info" => "measure_info"
    }
  }
  # Optional: Date filter to parse the start_date field
  date {
    match => ["start_date", "MM/dd/yyyy"]
    target => "@timestamp"
  }
}

# https://www.elastic.co/guide/en/logstash/current/plugins-outputs-kafka.html
output {
  kafka {
    bootstrap_servers => "kafka01:9092"
    topic_id => "elk-docker"
    codec => json
  }
}
