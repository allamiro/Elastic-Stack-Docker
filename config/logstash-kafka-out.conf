# Logstash Kafka Consumer Configuration
# This pipeline consumes messages from Kafka and sends them to Elasticsearch

input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS}"
    topics => ["${KAFKA_TOPIC}"]
    group_id => "logstash-elasticsearch-consumer"
    codec => json
    # TLS settings - trust the stack-generated CA
    security_protocol => "SSL"
    ssl_truststore_location => "/usr/share/logstash/certs/ca/ca.crt"
    ssl_truststore_type => "PEM"
    # Consumer settings
    auto_offset_reset => "earliest"
    consumer_threads => 1
    decorate_events => "extended"
    # Metadata fields added: [@metadata][kafka][topic], [@metadata][kafka][partition], etc.
  }
}

filter {
  # Add processing metadata
  mutate {
    add_field => {
      "processed_by" => "logstash-kafka-out"
      "pipeline" => "kafka-consumer"
    }
  }

  # Extract Kafka metadata for indexing
  mutate {
    add_field => {
      "kafka_topic" => "%{[@metadata][kafka][topic]}"
      "kafka_partition" => "%{[@metadata][kafka][partition]}"
      "kafka_offset" => "%{[@metadata][kafka][offset]}"
    }
  }

  # Parse nested parsed object if exists (from producer)
  if [parsed] {
    mutate {
      rename => {
        "[parsed][level]" => "log_level"
        "[parsed][service]" => "service_name"
        "[parsed][message]" => "log_message"
      }
      remove_field => ["parsed"]
    }
  }

  # Add processing timestamp
  ruby {
    code => "event.set('processed_at', Time.now.utc.iso8601(3))"
  }
}

output {
  elasticsearch {
    index => "kafka-logs-%{+YYYY.MM.dd}"
    hosts => "${ELASTIC_HOSTS}"
    user => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    ssl_certificate_authorities => "certs/ca/ca.crt"
  }

  # Optional: stdout for debugging (comment out in production)
  # stdout { codec => rubydebug }
}
