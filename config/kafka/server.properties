# Kafka Server Configuration Template
# This file contains common Kafka server configurations for SSL setup

# Network and SSL Configuration
listeners=SSL://0.0.0.0:19092,PLAINTEXT_HOST://0.0.0.0:9092
advertised.listeners=SSL://kafka-broker-1:19092,PLAINTEXT_HOST://localhost:29092
listener.security.protocol.map=SSL:SSL,PLAINTEXT_HOST:SSL
inter.broker.listener.name=SSL

# SSL Configuration
ssl.keystore.location=/opt/kafka/config/certs/kafka-broker-1/kafka-broker-1.p12
ssl.keystore.password=changeme
ssl.keystore.type=PKCS12
ssl.key.password=changeme

ssl.truststore.location=/opt/kafka/config/certs/ca/ca.p12
ssl.truststore.password=changeme
ssl.truststore.type=PKCS12

ssl.client.auth=required
ssl.endpoint.identification.algorithm=

# Topic Configuration
num.partitions=3
default.replication.factor=3
min.insync.replicas=2
auto.create.topics.enable=true

# Log Configuration
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

# Performance Configuration
num.network.threads=8
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
